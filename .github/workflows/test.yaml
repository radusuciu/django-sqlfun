name: Test

on:
  # a branch push and its pull_request event both fired on every branch, so
  # each commit ran the whole matrix at least twice
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # superseded PR runs are wasted work, but a main run is the record of
  # main's health and is left to finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2.*', '6.0.*', '6.1.*']
        exclude:
          # Django 6.x requires Python >= 3.12
          - python-version: '3.10'
            django-version: '6.0.*'
          - python-version: '3.11'
            django-version: '6.0.*'
          - python-version: '3.10'
            django-version: '6.1.*'
          - python-version: '3.11'
            django-version: '6.1.*'
        include:
          # Python 3.14 support was added in Django 5.2.8, the floor pyproject
          # requires there; the 5.2.* cell above covers the latest patch
          - python-version: '3.14'
            django-version: '5.2.8'
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.28'
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --locked
        uv pip install "django==${{ matrix.django-version }}"

    - name: Run tests
      run: uv run --no-sync pytest tests/

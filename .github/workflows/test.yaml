name: Test

on:
  # a branch push and its pull_request event both fired on every branch, so
  # each commit ran the whole matrix at least twice
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # superseded PR runs are wasted work, but a main run is the record of
  # main's health and is left to finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        django-version: ['4.2', '5.2']
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.28'
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --locked
        uv pip install "django==${{ matrix.django-version }}.*"

    - name: Run tests
      run: uv run --no-sync pytest tests/
